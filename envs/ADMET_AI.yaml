# envs/ADMET_AI.yaml
# ADMET-AI (Chemprop-RDKit GNN) 실행을 위한 conda 환경
# 
# Snakefile의 conda 지시자에서 사용:
#   conda: "envs/{wildcards.admet}.yaml"
#
# 수동 생성 시:
#   conda env create -f envs/ADMET_AI.yaml
#   conda activate ADMET_AI

name: ADMET_AI
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip
  - pandas
  - numpy
  - rdkit                # ADMET-AI 내부에서 분자 처리에 사용
  - pip:
    - admet-ai           # Chemprop-RDKit GNN 기반 ADMET 예측